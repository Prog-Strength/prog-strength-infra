name: Lint

# Static analysis that needs no cloud access — runs on every PR targeting
# main, separate from the Terraform Plan workflow so it gives fast feedback
# and never assumes the AWS OIDC role just to lint. These checks mirror the
# pre-commit hooks (.pre-commit-config.yaml) so a clean local run predicts a
# green PR. terraform fmt/validate stay in plan.yml (validate needs `init`);
# the heavyweight terraform plan stays there too.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One in-flight lint per PR; newer pushes cancel the previous run.
  group: lint-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1

      - name: tflint --init
        # Installs the terraform ruleset plugin pinned in .tflint.hcl.
        run: tflint --init

      - name: tflint --recursive
        # Lints the root module and every module under modules/.
        run: tflint --recursive --format compact

  grafana-alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate provisioned Grafana alert rules
        # Grafana validates provisioning files only at STARTUP, and one bad
        # rule stops ProvisioningServiceImpl outright — taking Grafana, its
        # dashboards, and all alerting down together. On 2026-07-31 a rule
        # shipped with __dashboardUid__ but no __panelId__ and did exactly
        # that. This gate moves that failure from "discovered when monitoring
        # vanishes" to "red PR check".
        run: |
          python3 -m pip install --quiet pyyaml
          python3 monitoring/grafana/provisioning/alerting/validate_rules.py

  s3-exporter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pytest
        # The exporter is the only Python service this repo ships. Its scan
        # math decides what the S3 Storage dashboard claims your footprint
        # is, and it is unit-testable without AWS — so it gets a gate.
        run: |
          python3 -m pip install --quiet pytest pyyaml boto3 prometheus_client
          python3 -m pytest monitoring/s3_exporter/tests -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        # shellcheck is preinstalled on ubuntu-latest runners. Covers the
        # Terraform bootstrap templatefile and the on-host deploy scripts +
        # their sourced lib and tests. -x follows `source` directives.
        run: shellcheck -x modules/compute/bootstrap.sh deploy/*.sh deploy/lib/*.sh deploy/tests/*.sh

      - name: deploy tests
        # The deploy/tests/*.sh suites were shellchecked but never executed, so
        # a real regression in them could land green. They're dependency-free
        # bash — run them. compose-forwards-config catches a config.env key that
        # never gets forwarded into the container, which no other gate sees.
        run: |
          status=0
          for t in deploy/tests/*.test.sh; do
            echo "--- ${t}"
            bash "$t" || status=1
          done
          exit "$status"
