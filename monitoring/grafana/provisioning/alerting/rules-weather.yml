# Weather integration alerts. Five monitors on the ps-weather dashboard's
# budget, liveness, and provider-health signals.
#
# WHY GAUGES FROM A PERSISTED LEDGER — every expression here reads a gauge the
# API exports from DURABLE state, not an in-process counter. The daily budget
# ledger (calls used today, shutoff flag) lives in the database and survives
# API restarts, and last_success_timestamp_seconds is a persisted stamp — the
# exact lesson of the WHOOP dead-ingestion incident (see rules-whoop.yml):
# asking a per-process counter "when did this last happen" or "how much have we
# spent today" gives an answer that resets with the container, and this API
# restarts roughly daily. Durable state makes the signal independent of process
# lifetime, so a restart can neither fire a budget alert spuriously nor silence
# a real one.
#
# LIVENESS IS FAIL-LOUD (weather-integration-dead only):
#   - `or vector(0)` makes a MISSING timestamp gauge fire rather than silently
#     pass — if the exporter is not publishing, we genuinely do not know
#     whether the integration is alive, and `time() - 0` is an enormous age
#     that crosses the 6h threshold. Fail-loud is the correct direction for a
#     liveness monitor.
#   - The two `and on()` gates keep it honest: `max(api_weather_enabled) > 0`
#     stops it paging for an integration that is switched off on purpose, and
#     `max(api_weather_saved_locations) > 0` stops it paging when there is
#     nothing to fetch (no saved locations means no calls means no successes,
#     healthily). Either gate failing empties the result (NoData) — and
#     noDataState: Alerting turns that into a page too, deliberately, because
#     NoData here means the enabled/locations gauges themselves are missing,
#     i.e. the exporter is down. execErrState: Alerting makes a broken query
#     (metric renamed) surface loudly as well.
#
# THE OTHER FOUR KEEP noDataState: OK — they read gauges the exporter publishes
# CONTINUOUSLY (utilization, shutoff flag) or a counter family that may simply
# not exist yet (provider errors before the first error). A scrape gap or a
# not-yet-incremented series must not page: the liveness rule above owns
# "metrics are missing", and having exactly one owner for that failure mode is
# what keeps a Prometheus hiccup from paging five times at once. They also keep
# execErrState: OK for the same single-owner reason.
#
# THRESHOLD 5.5 ON PROVIDER ERRORS — not 5 or 6: the README's midpoint
# convention. increase() extrapolates and can report slightly under or over an
# integer for a whole number of events, so a threshold AT 5 or 6 makes "the
# 6th error in an hour" fire unreliably. 5.5 fires reliably on the 6th error
# and never on the 5th.

apiVersion: 1

groups:
  - orgId: 1
    name: weather
    folder: Prog Strength Alerts
    interval: 1m
    rules:
      - uid: weather-budget-warning
        title: Weather budget utilization above 75% — warning
        condition: C
        data:
          - refId: A
            # Gauge read; 10m lookback only so a single missed scrape does not
            # blank the query.
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(api_weather_budget_utilization_ratio)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.75]
        noDataState: OK
        execErrState: OK
        # 10m: utilization only ever rises within a UTC day, so this is not
        # about flapping — it is about not paging on a single scrape's blip.
        for: 10m
        labels:
          severity: warning
          service: weather
        annotations:
          summary: >-
            Weather provider budget utilization is past 75% of the daily call
            budget — early notice, with room to react before the auto-shutoff
            engages at 100%.
          __dashboardUid__: ps-weather
          __panelId__: "1"

      - uid: weather-budget-critical
        title: Weather budget utilization above 90% — critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(api_weather_budget_utilization_ratio)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.90]
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: critical
          service: weather
        annotations:
          summary: >-
            Weather provider budget utilization is past 90% — the auto-shutoff
            is imminent; whatever is burning calls needs attention now.
          __dashboardUid__: ps-weather
          __panelId__: "1"

      - uid: weather-shutoff-engaged
        title: Weather auto-shutoff engaged — critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: max(api_weather_shutoff_active)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # Gauge is 0/1; 0.5 is the unambiguous midpoint.
                - evaluator:
                    type: gt
                    params: [0.5]
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: critical
          service: weather
        annotations:
          summary: >-
            The weather daily-budget auto-shutoff has engaged — no further
            provider calls will be made and the tile serves stale data for the
            rest of the UTC day.
          __dashboardUid__: ps-weather
          __panelId__: "3"

      - uid: weather-integration-dead
        title: Weather integration dead — critical
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                (time() - (max(api_weather_last_success_timestamp_seconds) or vector(0)))
                and on() (max(api_weather_enabled) > 0)
                and on() (max(api_weather_saved_locations) > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              # Seconds since the last successful provider call. 21600 = 6h.
              conditions:
                - evaluator:
                    type: gt
                    params: [21600]
        # Deliberate departure from this file's noDataState: OK convention —
        # see the liveness block in the header comment.
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        labels:
          severity: critical
          service: weather
        annotations:
          summary: >-
            No successful weather provider call in over 6h while the
            integration is enabled and at least one location is saved — the
            weather integration is dead.
          # Panel 6 ("Time since last successful call") plots this rule's
          # liveness expression exactly. Grafana rejects a rule carrying only
          # ONE of this annotation pair — always both, or neither.
          __dashboardUid__: ps-weather
          __panelId__: "6"

      - uid: weather-provider-errors
        title: Weather provider errors elevated — warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum(increase(api_weather_provider_calls_total{result="error"}[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              # 5.5, not 5 or 6 — midpoint convention, see header comment.
              conditions:
                - evaluator:
                    type: gt
                    params: [5.5]
        noDataState: OK
        execErrState: OK
        for: 0s
        labels:
          severity: warning
          service: weather
        annotations:
          summary: >-
            More than 5 weather provider call errors in the last hour — a
            flaky provider, not (yet) a dead one; the liveness rule covers the
            dead case.
          __dashboardUid__: ps-weather
          __panelId__: "8"
