# WHOOP integration diagnostics alerts. Two complementary monitors on the
# ps-whoop dashboard's ingestion and webhook-routing health.
#
# Rule A (dead ingestion) is a cause-agnostic liveness backstop: it fires when
# no webhook-driven WHOOP window sync has succeeded in 48h while ≥1 account is
# connected.
#
# WHY A TIMESTAMP GAUGE AND NOT increase() ON A COUNTER — this rule previously
# evaluated:
#
#   sum(increase(api_whoop_syncs_total{kind="window",result="ok"}[36h]))
#
# and it fired CONTINUOUSLY over completely healthy ingestion. api_whoop_syncs_total
# is a per-process counter: it resets to zero on every API restart, and its
# {kind="window",result="ok"} child does not exist at all until that process's
# first window sync. WHOOP nudges us roughly once a day and the API container
# restarts about as often, so each process typically recorded exactly ONE window
# sync and the counter sat at 1 for its whole life. increase() is last-minus-first
# with a correction for decreases, and 1 → (restart) → 1 is neither a rise nor a
# decrease — so it evaluated to 0 no matter how healthy ingestion was. Confirmed
# on 2026-08-06: syncs landed at 08-04 11:07Z and 08-05 15:09Z, the second one
# 15h inside the window, and the rule was still firing.
#
# The fix is to stop asking a counter "when did this last happen", a question it
# structurally cannot answer across restarts. The API now persists
# user_whoop_connection.last_window_sync_at on every successful kind="window"
# sync (migration 052) and the whoopadmin exporter publishes the newest such
# stamp across CONNECTED connections as
# api_whoop_last_window_sync_timestamp_seconds. Durable state survives restarts,
# so the signal is independent of process lifetime. Backfill and admin_resync
# deliberately do not advance it — same reasoning that gives SyncSince its own
# metric label: an operator resyncing to investigate an outage must not silence
# the alert that reported it.
#
# How the pieces interact:
#   - `or vector(0)` makes a MISSING gauge fire rather than silently pass. If
#     the exporter is not publishing, we genuinely do not know whether ingestion
#     is alive, and `time() - 0` is an enormous age that crosses the threshold.
#     Fail-loud is the correct direction for a liveness monitor.
#   - `and on() (sum(api_whoop_connections{status="connected"}) > 0)` gates on
#     there being ≥1 connected account, so an empty or fully-disconnected DB
#     does not page for an integration nobody is using. The expression returns
#     an empty result (→ NoData) ONLY in that zero-connections case.
#
# THRESHOLD — 48h, not 36h. Observed webhook gaps run 21.7h and 28.0h against a
# nominally ~24h cadence, so 36h left only ~8h of headroom: one night without
# the watch, or travel delaying recovery scoring, would page legitimately. 48h
# still catches a genuinely dead feed within two cycles.
#
# noDataState: Alerting on Rule A is a DELIBERATE departure from this file's
#   usual noDataState: OK convention (documented in README.md for error
#   counters). Rule A is a liveness monitor — it alerts on the ABSENCE of
#   success, not on an error counter. Alerting-on-NoData covers the
#   zero-connections case above (which doubles as a "reconnect me" signal) and,
#   with execErrState: Alerting, ensures a genuinely broken query surfaces
#   loudly rather than silently.
#
# Rule B (webhook misroute) is the fast, specific complement: it fires within
# an hour when any api_webhook_misroute_total increments, naming the offending
# provider so the operator can fix the webhook URL in the WHOOP Developer
# Dashboard. It is a plain error counter, so it keeps noDataState: OK.
#
# Thresholds sit at 0.5 (rather than 1) because increase() extrapolates and can
# report slightly under an integer; 0.5 makes "1 event" cross reliably.

apiVersion: 1

groups:
  - orgId: 1
    name: whoop
    folder: Prog Strength Alerts
    interval: 1m
    rules:
      - uid: whoop-dead-ingestion
        title: WHOOP ingestion dead — critical
        condition: C
        data:
          - refId: A
            # A gauge read needs no lookback — unlike the increase() it
            # replaced, the value is a point-in-time timestamp. Kept at 10m
            # only so a single missed scrape does not blank the query.
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: |-
                (
                  time() - (max(api_whoop_last_window_sync_timestamp_seconds) or vector(0))
                )
                and on()
                (sum(api_whoop_connections{status="connected"}) > 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              # Seconds since the last successful window sync. 172800 = 48h.
              conditions:
                - evaluator:
                    type: gt
                    params: [172800]
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        labels:
          severity: critical
          service: whoop
        annotations:
          summary: >-
            No webhook-driven WHOOP window sync has succeeded in over 48h while
            at least one account is connected — WHOOP ingestion is dead.
          # Grafana rejects a rule carrying only ONE of this pair — the
          # provisioner fails the whole file and ProvisioningServiceImpl
          # stops, which takes Grafana's background services down with it.
          # Always set both, or neither. Panel 17 ("Time since last window
          # sync") plots this rule's expression exactly; it replaced the link
          # to panel 10, which plots the per-process counter this rule no
          # longer reads and would now send the operator to the wrong series.
          __dashboardUid__: ps-whoop
          __panelId__: "17"

      - uid: whoop-webhook-misroute
        title: WHOOP webhook misrouted — warning
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: sum by (provider) (increase(api_webhook_misroute_total[1h]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.5]
        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: warning
          service: whoop
        annotations:
          summary: >-
            Webhook deliveries for provider {{ .Labels.provider }} were
            misrouted in the last hour — fix the webhook URL in the WHOOP
            Developer Dashboard.
          # NO dashboard link, deliberately — and it must stay all-or-nothing
          # (see the note on the rule above). No ps-whoop panel plots
          # api_webhook_misroute_total, and linking this to a handler-side
          # panel like "Webhook deliveries by outcome" would be actively
          # misleading: a misrouted delivery 404s at the router and never
          # reaches the handler, so it can never appear there. That blind
          # spot is the exact reason this rule exists. Add a misroute panel
          # first, then link both annotations to it.
